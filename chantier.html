<style>
:root{--bg:#10151f;--card:#1a2230;--hov:#202a3c;--inp:#151d2a;--sd:#0b0f17;--sdh:#141c2a;
--b:#243044;--bhi:#2e3d58;--bsd:rgba(255,255,255,.06);
--ac:#c06518;--ac2:#e07b26;--acd:rgba(224,123,38,.14);
--gr:#2fa86f;--grd:rgba(47,168,111,.14);--bl:#3478c8;--nv:#4e8fd8;--nvd:rgba(78,143,216,.12);
--pu:#7c3aed;--pud:rgba(124,58,237,.13);--gd:#d9a520;--gdd:rgba(217,165,32,.13);--rd:#d94040;--rdd:rgba(217,64,64,.13);
--tx:#d9e3f5;--tx2:#6c7e9e;--tx3:#3c4c6a;--sdt:rgba(255,255,255,.62);--sdlo:rgba(255,255,255,.25);
--fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'IBM Plex Mono',monospace;--r:7px}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:14px;display:flex;min-height:100vh;overflow:hidden}
a{color:var(--nv)}
/* SIDEBAR */
.sb{width:225px;flex-shrink:0;background:var(--sd);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sbl{padding:20px 18px 16px;border-bottom:1px solid var(--bsd)}
.sbb{font-family:var(--fh);font-size:22px;font-weight:800;color:#fff;letter-spacing:.04em}
.sbb span{color:var(--ac2)}
.sbp{font-family:var(--fm);font-size:9px;color:var(--sdlo);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.sbn{flex:1;padding:10px 0}
.sbs{font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--sdlo);padding:12px 18px 5px}
.si{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sdt);border-left:3px solid transparent;transition:all .15s}
.si:hover{background:var(--sdh);color:#fff}.si.on{color:#fff;border-left-color:var(--ac2);background:var(--acd)}
.si-i{font-size:15px;width:20px;text-align:center}
.si-b{font-family:var(--fm);font-size:9px;padding:1px 6px;border-radius:10px;background:var(--rd);color:#fff;margin-left:auto}
.sbf{padding:14px 18px;border-top:1px solid var(--bsd);font-family:var(--fm);font-size:9px;color:var(--sdlo);display:flex;flex-direction:column;gap:6px}
.conn{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}.dot.ok{background:var(--gr)}
/* LAYOUT */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.topbar{background:var(--card);border-bottom:2px solid var(--ac);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0}
.tbt{font-family:var(--fh);font-size:24px;font-weight:800;letter-spacing:.04em}
.tbs{font-family:var(--fm);font-size:10px;color:var(--tx2);margin-top:1px}
.tbr{display:flex;gap:8px;flex-wrap:wrap}
.cw{flex:1;overflow-y:auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:18px}
.cw::-webkit-scrollbar{width:5px}.cw::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:3px}
/* UI */
.btn{font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:var(--r);border:none;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.82}.bta{background:var(--ac);color:#fff}.btb{background:var(--bl);color:#fff}.btv{background:var(--gr);color:#fff}
.btg{background:transparent;border:1px solid var(--bhi);color:var(--tx2)}.btr{background:transparent;border:1px solid var(--rd);color:var(--rd)}
.bts{padding:4px 10px;font-size:11px}
.card{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ct{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mono{font-family:var(--fm);font-size:11px;color:var(--tx2)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--ac)}
.kpi .v{font-family:var(--fh);font-size:32px;font-weight:800}.kpi .l{font-family:var(--fm);font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.1em}
.bar{height:7px;background:var(--inp);border-radius:4px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--ac2);border-radius:4px}
.bar.g>i{background:var(--gr)}.bar.r>i{background:var(--rd)}
.tag{display:inline-block;font-family:var(--fm);font-size:9px;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor}
.t-gr{color:var(--gr)}.t-rd{color:var(--rd)}.t-gd{color:var(--gd)}.t-nv{color:var(--nv)}.t-pu{color:#a78bfa}.t-tx{color:var(--tx2)}
table{width:100%;border-collapse:collapse}th{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--b)}
td{padding:8px;border-bottom:1px solid var(--bsd);vertical-align:top}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--hov)}
.tw{overflow-x:auto}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bsd)}.li:last-child{border-bottom:none}
.li .f{flex:1;min-width:0}.li .s{font-size:12px;color:var(--tx2)}
.empty{color:var(--tx3);font-style:italic;padding:10px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--b);margin-bottom:4px}
.tab{padding:8px 14px;cursor:pointer;font-family:var(--fh);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--tx2);border-bottom:2px solid transparent}
.tab.on{color:var(--ac2);border-bottom-color:var(--ac2)}
input,select,textarea{background:var(--inp);border:1px solid var(--b);color:var(--tx);border-radius:var(--r);padding:8px 10px;font-family:var(--fb);font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac2)}
input[type=checkbox]{width:auto;accent-color:var(--ac2)}input[type=range]{padding:0}
label.fl{display:block;font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx2);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.alert{border-left:3px solid var(--rd);background:var(--rdd);padding:9px 12px;border-radius:var(--r);font-size:13px}
.alert.w{border-color:var(--gd);background:var(--gdd)}.alert.i{border-color:var(--nv);background:var(--nvd)}
/* CHANTIER CARDS */
.chc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:16px;cursor:pointer;border-left:4px solid var(--ac2);transition:background .15s}
.chc:hover{background:var(--hov)}.chc h3{font-family:var(--fh);font-size:20px;letter-spacing:.03em}
/* GANTT */
.gt{position:relative;min-width:640px}
.gtr{display:grid;grid-template-columns:200px 1fr;align-items:center;border-bottom:1px solid var(--bsd);min-height:32px}
.gtl{font-size:12px;padding:4px 8px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtt{position:relative;height:32px}
.gtb{position:absolute;top:8px;height:16px;border-radius:4px;background:var(--bhi);overflow:hidden}
.gtb>i{display:block;height:100%;background:var(--ac2)}.gtb.late>i{background:var(--rd)}
.gtm{position:absolute;top:0;bottom:0;border-left:1px dashed var(--bhi);font-family:var(--fm);font-size:9px;color:var(--tx3);padding-left:3px}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--rd);z-index:2}
/* ETAPES */
.et{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.etp{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--bhi);cursor:pointer;color:var(--tx2);user-select:none}
.etp.ok{background:var(--grd);border-color:var(--gr);color:var(--gr)}
/* PHASES chantier */
.ph{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.phs{flex:1;min-width:92px;padding:8px 6px;text-align:center;font-size:11px;background:var(--inp);border-radius:4px;cursor:pointer;border-bottom:3px solid var(--tx3);color:var(--tx2)}
.phs.done{border-bottom-color:var(--gr);color:var(--tx)}.phs.cur{border-bottom-color:var(--ac2);background:var(--acd);color:#fff;font-weight:600}
/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 12px}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--bhi);border-radius:10px;padding:20px;width:100%;max-width:640px}
.md.lg{max-width:920px}
.mdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mdf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.x{background:none;border:none;color:var(--tx2);font-size:22px;cursor:pointer}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--ac2);padding:10px 16px;border-radius:var(--r);z-index:99;font-size:13px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;max-width:360px}
.toast.on{opacity:1;transform:none}
.obs{background:var(--inp);border:1px solid var(--b);border-radius:var(--r);padding:10px;margin-bottom:8px}
.mb{display:none}
/* PHOTOS */
.phs-w{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ph-t{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;background:var(--inp);border:1px solid var(--b);flex-shrink:0}
.ph-t img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph-t button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:13px;line-height:22px}
.ph-add{width:76px;height:76px;border:1px dashed var(--bhi);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);font-size:11px;gap:2px;flex-shrink:0}
.ph-add:hover{border-color:var(--ac2);color:var(--ac2)}.ph-add b{font-size:22px}
.ph-s{width:44px;height:44px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:120;display:none;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:6px}
.off{color:var(--gd)}
/* MOBILE */
@media(max-width:820px){
 body{flex-direction:column}
 .sb{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:fixed;bottom:0;left:0;z-index:40;border-top:1px solid var(--b)}
 .sbl,.sbs,.sbf{display:none}.sbn{display:flex;padding:0}
 .si{flex-direction:column;gap:2px;padding:8px 12px;font-size:10px;border-left:none;border-top:3px solid transparent}
 .si.on{border-top-color:var(--ac2)}
 .sb{padding-bottom:env(safe-area-inset-bottom)}
 .main{height:calc(100vh - 58px - env(safe-area-inset-bottom))}.topbar{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}.cw{padding:16px 16px 40px}
 .md{padding:16px}.ov{padding:12px 8px}
 .tbt{font-size:20px}.tbr .btn{padding:6px 10px;font-size:11px}.tab{padding:7px 9px;font-size:12px}
 .gtr{grid-template-columns:120px 1fr}
}
/* PRINT CR */
#printArea{display:none}
@media print{
 body{background:#fff;color:#000;display:block;overflow:visible}
 .sb,.main,.ov,.toast{display:none!important}
 #printArea{display:block;font-family:Arial,sans-serif;font-size:11pt;color:#000}
 #printArea h1{font-size:16pt;margin-bottom:4px}#printArea h2{font-size:12pt;margin:14px 0 6px;border-bottom:1px solid #000;padding-bottom:2px}
 #printArea table{border-collapse:collapse;width:100%}#printArea td,#printArea th{border:1px solid #555;padding:4px 6px;font-size:9.5pt;color:#000;text-align:left}
 #printArea th{background:#eee}
 #printArea img{max-width:160px;max-height:120px;margin:2px;border:1px solid #999}
}
</style>
</head>
<body>
<aside class="sb">
 <div class="sbl"><div class="sbb">ÉQUILIBRE <span>·</span> BTP</div><div class="sbp">Suivi de chantier TCE</div></div>
 <nav class="sbn" id="nav"></nav>
 <div class="sbf">
  <div class="conn"><span class="dot" id="msDot"></span><span id="msLbl">Outlook non connecté</span></div>
  <div id="lastRun">Automatisations : —</div>
  <div id="netSt"></div>
 </div>
</aside>
<div class="main">
 <div class="topbar"><div><div class="tbt" id="pgTitle"></div><div class="tbs" id="pgSub"></div></div><div class="tbr" id="pgActions"></div></div>
 <div class="cw" id="view"></div>
</div>

<script>
'use strict';
/* =========================================================
   CONSTANTES MÉTIER
   ========================================================= */
var LOTS_TCE=[
 ['01','VRD / Terrassements'],['02','Gros œuvre / Maçonnerie'],['03','Charpente bois / métal'],['04','Couverture / Zinguerie'],
 ['05','Étanchéité'],['06','Façades / Ravalement / ITE'],['07','Menuiseries extérieures'],['08','Serrurerie / Métallerie'],
 ['09','Plâtrerie / Cloisons / Doublages'],['10','Faux plafonds'],['11','Menuiseries intérieures'],['12','Électricité CFO / CFA'],
 ['13','Plomberie / Sanitaires'],['14','CVC / Chauffage / Ventilation'],['15','Carrelage / Faïence'],['16','Sols souples / Parquets'],
 ['17','Peinture / Revêtements muraux'],['18','Ascenseurs'],['19','Espaces verts'],['20','Nettoyage']];
var ETAPES_LOT=['Plans d\'exé / VISA','Approvisionnement','Démarrage','Exécution 50 %','Exécution 100 %','Autocontrôle','OPR','Levée réserves','DOE remis'];
var PHASES=['Préparation','Installation','Gros œuvre','Clos / couvert','Second œuvre','Finitions','OPR','Réception','Levée réserves','GPA'];
var TYPES_RDV=['Réunion de chantier','Visite de chantier','Réunion de lancement','OPR','Réception','RDV entreprise','RDV client / MOA'];
var ROLES=['Maître d\'ouvrage','Maître d\'œuvre','Architecte','Entreprise','Bureau de contrôle','CSPS','BET','Client','Autre'];

/* =========================================================
   DONNÉES
   ========================================================= */
var KEY='eqbtp_db';
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function defaultDB(){return{
 version:1,
 settings:{nom:'',societe:'',email:'',signature:'',msClientId:'',msTenant:'common',webhook:''},
 rules:{
  rappelReunion:{on:true,jours:2},
  crAuto:{on:true},
  diffusionCR:{on:true},
  tachesCR:{on:true},
  prochaineReunion:{on:true},
  relanceTaches:{on:true,freq:3},
  alerteRetard:{on:true,seuil:10},
  relanceReserves:{on:true},
  rapportHebdo:{on:false,jour:5,dest:''},
  syncOutlook:{on:true,calendrier:true,todo:true,mails:true}
 },
 chantiers:[],outbox:[],log:[],done:{},lastRun:null};}
var DB;
try{DB=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){DB=null;}
if(!DB){DB=defaultDB();}
(function migrate(){var d=defaultDB();for(var k in d)if(DB[k]===undefined)DB[k]=d[k];
 for(var r in d.rules)if(!DB.rules[r])DB.rules[r]=d.rules[r];for(var s in d.settings)if(DB.settings[s]===undefined)DB.settings[s]=d.settings[s];})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('⚠️ Stockage plein : exportez vos données');}}

/* =========================================================
   OUTILS
   ========================================================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function fr(s){if(!s)return'—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function frl(s){if(!s)return'—';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
var _tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('on');},3200);}
function val(id){var e=$(id);return e?e.value.trim():'';}
function opts(arr,sel){return arr.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return'<option value="'+esc(v)+'"'+(v==sel?' selected':'')+'>'+esc(l)+'</option>';}).join('');}
function C(id){return DB.chantiers.find(function(c){return c.id===id;});}
function lotOf(c,id){return c.lots.find(function(l){return l.id===id;});}
function intOf(c,id){return c.intervenants.find(function(i){return i.id===id;});}
function lotName(c,id){var l=lotOf(c,id);return l?l.code+' '+l.nom:'Général';}
function openOv(html,lg){$('md').className='md'+(lg?' lg':'');$('md').innerHTML=html;$('ov').classList.add('on');fillPh($('md'));}
function closeOv(){$('ov').classList.remove('on');}
$('ov').addEventListener('mousedown',function(e){if(e.target===this)closeOv();});
function journal(c,type,texte,source){c.journal.unshift({id:uid(),date:new Date().toISOString(),type:type,texte:texte,source:source||'manuel'});}
function logA(rule,msg){DB.log.unshift({d:new Date().toISOString(),rule:rule,msg:msg});DB.log=DB.log.slice(0,300);}

/* Avancement */
function lotPct(l){if(!l.etapes||!l.etapes.length)return l.avancement||0;return Math.round(l.etapes.filter(function(e){return e.fait;}).length/l.etapes.length*100);}
function lotTheo(l){if(!l.debut||!l.fin)return null;var t=today();if(t<=l.debut)return 0;if(t>=l.fin)return 100;return Math.round(diff(l.debut,t)/Math.max(1,diff(l.debut,l.fin))*100);}
function lotEcart(l){var th=lotTheo(l);return th==null?0:lotPct(l)-th;}
function chPct(c){if(!c.lots.length)return 0;var tot=0,w=0;c.lots.forEach(function(l){var p=+l.montant||1;tot+=lotPct(l)*p;w+=p;});return Math.round(tot/w);}
function tachesRetard(c){var t=today();return c.taches.filter(function(x){return x.statut!=='done'&&x.echeance&&x.echeance<t;});}
function reservesOuvertes(c){return c.reserves.filter(function(r){return r.statut!=='levee';});}
function lotsRetard(c){return c.lots.filter(function(l){return lotPct(l)<100&&lotEcart(l)<=-DB.rules.alerteRetard.seuil;});}
function emailsOf(c,ids){return(ids||[]).map(function(i){var p=intOf(c,i);return p&&p.email;}).filter(Boolean);}
function allEmails(c){return c.intervenants.map(function(i){return i.email;}).filter(Boolean);}

/* =========================================================
   NAVIGATION
   ========================================================= */
var S={page:'dash',ch:null,tab:'synthese'};

   ========================================================= */
function rDash(){
 head('Tableau de bord',new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),'<button class="btn bta" onclick="editChantier()">+ Chantier</button><button class="btn btg" onclick="runAutomations(true)">▶ Lancer automatisations</button>');
 var act=DB.chantiers.filter(function(c){return c.statut!=='termine';});
 var tr=[],rs=0,rdv=[],alerts=[],t=today(),t7=addDays(t,7);
 act.forEach(function(c){
  tachesRetard(c).forEach(function(x){tr.push({c:c,x:x});});rs+=reservesOuvertes(c).length;
  c.reunions.forEach(function(r){if(r.date>=t&&r.date<=t7)rdv.push({c:c,r:r});});
  lotsRetard(c).forEach(function(l){alerts.push({c:c,txt:'Lot '+l.code+' '+l.nom+' : '+lotPct(l)+' % réalisé vs '+lotTheo(l)+' % prévu'});});
  c.reunions.forEach(function(r){if(r.date<t&&!r.crId)alerts.push({c:c,txt:'CR manquant pour « '+r.type+' » du '+fr(r.date),w:1});});
 });
 rdv.sort(function(a,b){return(a.r.date+a.r.heure).localeCompare(b.r.date+b.r.heure);});
 var ob=DB.outbox.filter(function(o){return!o.sent;});
 var h='<div class="grid g4">'+
  kpi(act.length,'Chantiers actifs','var(--ac2)')+kpi(rdv.length,'RDV sous 7 jours','var(--nv)')+
  kpi(tr.length,'Tâches en retard','var(--rd)')+kpi(rs,'Réserves ouvertes','var(--gd)')+'</div>';
 if(!DB.chantiers.length)h+='<div class="card"><div class="ct">Bienvenue</div><p style="margin:10px 0">Créez votre premier chantier : les 20 lots TCE et leurs étapes sont générés automatiquement. Vous pouvez aussi charger un chantier de démonstration.</p><div class="row" style="max-width:420px"><button class="btn bta" onclick="editChantier()">Créer un chantier</button><button class="btn btg" onclick="demo()">Charger la démo</button></div></div>';
 if(ob.length)h+='<div class="alert i">📤 '+ob.length+' message(s) en attente d\'envoi dans la boîte d\'envoi (Outlook non connecté). <a href="#" onclick="go(\'auto\');return false">Voir</a></div>';
 h+='<div class="grid g2"><div class="card"><div class="ch"><div class="ct">Alertes</div></div>'+(alerts.length?alerts.map(function(a){return'<div class="alert'+(a.w?' w':'')+'" style="margin-bottom:6px;cursor:pointer" onclick="go(\'chantier\',\''+a.c.id+'\',\'synthese\')"><b>'+esc(a.c.nom)+'</b> — '+esc(a.txt)+'</div>';}).join(''):'<div class="empty">Aucune alerte. Tout est dans les temps.</div>')+'</div>'+
  '<div class="card"><div class="ch"><div class="ct">Prochains rendez-vous</div></div>'+(rdv.length?rdv.map(function(o){return'<div class="li" style="cursor:pointer" onclick="editReunion(\''+o.c.id+'\',\''+o.r.id+'\')"><div class="mono" style="width:90px">'+frl(o.r.date)+'<br>'+esc(o.r.heure||'')+'</div><div class="f"><b>'+esc(o.r.type)+'</b><div class="s">'+esc(o.c.nom)+' · '+esc(o.r.lieu||'')+'</div></div>'+(o.r.outlookId?'<span class="tag t-nv">Outlook</span>':'')+'</div>';}).join(''):'<div class="empty">Rien de prévu cette semaine.</div>')+'</div></div>';
 h+='<div class="card"><div class="ch"><div class="ct">Avancement des chantiers</div></div>'+(act.length?act.map(function(c){var p=chPct(c);return'<div class="li" style="cursor:pointer" onclick="go(\'chantier\',\''+c.id+'\',\'synthese\')"><div class="f"><b>'+esc(c.nom)+'</b> <span class="mono">'+esc(c.ref)+' · '+esc(PHASES[c.phase||0])+'</span><div class="bar" style="margin-top:6px"><i style="width:'+p+'%"></i></div></div><div style="font-family:var(--fh);font-size:22px;font-weight:800;width:60px;text-align:right">'+p+'%</div></div>';}).join(''):'<div class="empty">Aucun chantier actif.</div>')+'</div>';
 h+='<div class="card"><div class="ch"><div class="ct">Tâches en retard</div></div>'+(tr.length?tr.slice(0,12).map(function(o){return taskLine(o.c,o.x,true);}).join(''):'<div class="empty">Aucune tâche en retard.</div>')+'</div>';
 $('view').innerHTML=h;
}

 '<div class="row"><div><label class="fl">Client / MOA</label><input id="f_client" value="'+esc(c.client)+'"></div><div><label class="fl">Statut</label><select id="f_statut">'+opts([['preparation','Préparation'],['en_cours','En cours'],['suspendu','Suspendu'],['termine','Terminé']],c.statut)+'</select></div></div>'+
 '<label class="fl">Adresse</label><input id="f_adr" value="'+esc(c.adresse)+'">'+
 '<div class="row"><div><label class="fl">Début travaux</label><input type="date" id="f_deb" value="'+esc(c.debut)+'"></div><div><label class="fl">Fin contractuelle</label><input type="date" id="f_fin" value="'+esc(c.fin)+'"></div></div>'+
 (id?'':'<label class="fl">Lots à créer</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px;max-height:220px;overflow:auto;padding:6px;background:var(--inp);border-radius:var(--r)">'+LOTS_TCE.map(function(l,i){return'<label class="chk" style="font-size:12px"><input type="checkbox" class="f_lot" value="'+i+'"'+([0,18,17].indexOf(i)<0?' checked':'')+'> '+l[0]+' '+esc(l[1])+'</label>';}).join('')+'</div><div class="mono" style="margin-top:4px">Les dates des lots sont réparties automatiquement sur la durée du chantier — ajustables ensuite.</div>')+
 '<label class="fl">Notes</label><textarea id="f_notes" rows="2">'+esc(c.notes)+'</textarea>'+
 '<div class="mdf">'+(id?'<button class="btn btr" onclick="delChantier(\''+id+'\')">Supprimer</button>':'')+'<button class="btn btg" onclick="closeOv()">Annuler</button><button class="btn bta" onclick="saveChantier(\''+(id||'')+'\')">Enregistrer</button></div>');
}
function saveChantier(id){
 var nom=val('f_nom');if(!nom){toast('Nom obligatoire');return;}
 var c=id?C(id):{id:uid(),phase:0,lots:[],intervenants:[],taches:[],reunions:[],crs:[],reserves:[],journal:[]};
 c.nom=nom;c.ref=val('f_ref')||c.ref;c.client=val('f_client');c.statut=val('f_statut');c.adresse=val('f_adr');c.debut=val('f_deb');c.fin=val('f_fin');c.notes=val('f_notes');
 if(!id){
  var sel=[].slice.call(document.querySelectorAll('.f_lot:checked')).map(function(e){return+e.value;});
  var dur=Math.max(30,diff(c.debut,c.fin));
  sel.forEach(function(i){var l=LOTS_TCE[i],k=i/LOTS_TCE.length;
   var st=Math.round(dur*Math.min(.8,k*.95)),ln=Math.round(dur*(i<2?.3:i<8?.25:.3));
   c.lots.push({id:uid(),code:l[0],nom:l[1],entreprise:'',montant:'',debut:addDays(c.debut,st),fin:addDays(c.debut,Math.min(dur,st+ln)),etapes:ETAPES_LOT.map(function(n){return{n:n,fait:false,d:null};})});});
  DB.chantiers.push(c);journal(c,'Création','Chantier créé avec '+c.lots.length+' lots','manuel');
 }
 save();closeOv();go('chantier',c.id,'synthese');toast('Chantier enregistré');
}
function delChantier(id){if(!confirm('Supprimer définitivement ce chantier ?'))return;DB.chantiers=DB.chantiers.filter(function(c){return c.id!==id;});save();closeOv();go('chantiers');}

/* ---------- Fiche chantier ---------- */
var TABS=[['synthese','Synthèse'],['lots','Lots & étapes'],['planning','Planning'],['taches','Tâches'],['reunions','Réunions & CR'],['reserves','Réserves'],['intervenants','Intervenants'],['journal','Journal']];
function rChantier(){
 var c=C(S.ch);if(!c){go('chantiers');return;}
 head(c.nom,c.ref+' · '+(c.client||'')+' · '+(c.adresse||''),'<button class="btn btg" onclick="addNote(\''+c.id+'\')">📷 Note / photo</button><button class="btn btg" onclick="editChantier(\''+c.id+'\')">Modifier</button><button class="btn btb" onclick="editReunion(\''+c.id+'\')">+ RDV</button><button class="btn bta" onclick="editTache(\''+c.id+'\')">+ Tâche</button>');
 var h='<div class="tabs">'+TABS.map(function(t){return'<div class="tab'+(S.tab===t[0]?' on':'')+'" onclick="S.tab=\''+t[0]+'\';rChantier()">'+t[1]+'</div>';}).join('')+'</div>';
 h+=({synthese:tSynthese,lots:tLots,planning:tPlanning,taches:tTaches,reunions:tReunions,reserves:tReserves,intervenants:tIntervenants,journal:tJournal}[S.tab]||tSynthese)(c);
 $('view').innerHTML=h;fillPh($('view'));
}
function tSynthese(c){
 var p=chPct(c),t=today(),nx=c.reunions.filter(function(r){return r.date>=t;}).sort(function(a,b){return a.date.localeCompare(b.date);})[0];
 var tempo=c.debut&&c.fin?Math.max(0,Math.min(100,Math.round(diff(c.debut,t)/Math.max(1,diff(c.debut,c.fin))*100))):0;
 var h='<div class="card"><div class="ch"><div class="ct">Phase du chantier</div><span class="mono">Cliquez pour faire avancer la phase</span></div><div class="ph">'+PHASES.map(function(ph,i){return'<div class="phs'+(i<(c.phase||0)?' done':i===(c.phase||0)?' cur':'')+'" onclick="setPhase(\''+c.id+'\','+i+')">'+(i<(c.phase||0)?'✓ ':'')+ph+'</div>';}).join('')+'</div></div>';
 h+='<div class="grid g4">'+kpi(p+' %','Avancement physique','var(--ac2)')+kpi(tempo+' %','Délai consommé',tempo>p+DB.rules.alerteRetard.seuil?'var(--rd)':'var(--gr)')+kpi(tachesRetard(c).length+' / '+c.taches.filter(function(x){return x.statut!=='done';}).length,'Tâches retard / ouvertes','var(--rd)')+kpi(reservesOuvertes(c).length,'Réserves ouvertes','var(--gd)')+'</div>';
 var lr=lotsRetard(c);
 h+='<div class="grid g2"><div class="card"><div class="ch"><div class="ct">Lots en retard</div></div>'+(lr.length?lr.map(function(l){return'<div class="li"><div class="f"><b>'+l.code+' '+esc(l.nom)+'</b><div class="s">'+esc(l.entreprise||'Entreprise non renseignée')+'</div></div><span class="tag t-rd">'+lotEcart(l)+' pts</span></div>';}).join(''):'<div class="empty">Aucun lot en retard (seuil '+DB.rules.alerteRetard.seuil+' pts).</div>')+'</div>'+
  '<div class="card"><div class="ch"><div class="ct">Prochain rendez-vous</div></div>'+(nx?'<div style="font-family:var(--fh);font-size:20px">'+esc(nx.type)+'</div><div class="mono">'+frl(nx.date)+' à '+esc(nx.heure)+' · '+esc(nx.lieu||'')+'</div><div style="margin-top:8px">'+nx.convoques.length+' convoqué(s) '+(nx.outlookId?'<span class="tag t-nv">Synchronisé Outlook</span>':'')+'</div>':'<div class="empty">Aucun RDV planifié.</div>')+'</div></div>';
 h+='<div class="card"><div class="ch"><div class="ct">Derniers événements</div><a href="#" onclick="S.tab=\'journal\';rChantier();return false" class="mono">Tout le journal →</a></div>'+jList(c.journal.slice(0,8))+'</div>';
 return h;
}
function setPhase(id,i){var c=C(id);c.phase=i;journal(c,'Phase','Passage en phase « '+PHASES[i]+' »');save();rChantier();hook('phase',{chantier:c.ref,phase:PHASES[i]});}

function tLots(c){
 return'<div class="card"><div class="ch"><div class="ct">Lots / corps d\'état</div><button class="btn bta bts" onclick="editLot(\''+c.id+'\')">+ Lot</button></div>'+(c.lots.length?c.lots.map(function(l){var p=lotPct(l),e=lotEcart(l),th=lotTheo(l);
  return'<div class="obs"><div class="ch" style="margin-bottom:6px"><div style="cursor:pointer" onclick="editLot(\''+c.id+'\',\''+l.id+'\')"><b>'+l.code+' — '+esc(l.nom)+'</b> <span class="mono">'+esc(l.entreprise||'entreprise ?')+' · '+fr(l.debut)+' → '+fr(l.fin)+'</span></div><div>'+(th!=null&&p<100&&e<=-DB.rules.alerteRetard.seuil?'<span class="tag t-rd">Retard '+e+' pts</span> ':'')+(p===100?'<span class="tag t-gr">Terminé</span>':'')+' <b style="font-family:var(--fh);font-size:18px">'+p+' %</b></div></div><div class="bar '+(p===100?'g':e<=-DB.rules.alerteRetard.seuil?'r':'')+'" style="margin-bottom:8px"><i style="width:'+p+'%"></i></div><div class="et">'+l.etapes.map(function(s,k){return'<span class="etp'+(s.fait?' ok':'')+'" title="'+(s.d?'Fait le '+fr(s.d):'')+'" onclick="togEtape(\''+c.id+'\',\''+l.id+'\','+k+')">'+(s.fait?'✓ ':'')+esc(s.n)+'</span>';}).join('')+'</div></div>';}).join(''):'<div class="empty">Aucun lot.</div>')+'</div>';
}

 hook('avancement',{chantier:c.ref,lot:l.code+' '+l.nom,etape:s.n,fait:s.fait,pct:lotPct(l)});}
function editLot(cid,lid){var c=C(cid),l=lid?lotOf(c,lid):{code:pad(c.lots.length+1),nom:'',entreprise:'',montant:'',debut:c.debut,fin:c.fin,etapes:null};

 '<div class="row"><div><label class="fl">Entreprise titulaire</label><input id="l_ent" value="'+esc(l.entreprise)+'" list="entlist"><datalist id="entlist">'+ents.map(function(x){return'<option value="'+esc(x.societe||x.nom)+'">';}).join('')+'</datalist></div><div><label class="fl">Montant marché HT (€) — pondère l\'avancement</label><input id="l_mt" type="number" value="'+esc(l.montant)+'"></div></div>'+

function saveLot(cid,lid){var c=C(cid),l=lid?lotOf(c,lid):{id:uid(),etapes:[]};

/* ---------- Planning ---------- */
function tPlanning(c){
 var ds=[c.debut].concat(c.lots.map(function(l){return l.debut;})).filter(Boolean).sort(),de=[c.fin].concat(c.lots.map(function(l){return l.fin;})).filter(Boolean).sort();
 if(!ds.length||!de.length)return'<div class="card empty">Renseignez les dates du chantier et des lots.</div>';
 var a=ds[0],b=de[de.length-1],tot=Math.max(1,diff(a,b));function x(d){return Math.max(0,Math.min(100,diff(a,d)/tot*100));}
 var ms='',ml='',d=new Date(a+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+1);
 while(iso(d)<b){ms+='<div class="gtm" style="left:'+x(iso(d))+'%">'+d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})+'</div>';ml+='<div class="gtm" style="left:'+x(iso(d))+'%"></div>';d.setMonth(d.getMonth()+1);}
 var t=today(),tl=t>=a&&t<=b?'<div class="today" style="left:'+x(t)+'%" title="Aujourd\'hui"></div>':'';

function newCR(cid,rid,open,auto){var c=C(cid),r=c.reunions.find(function(x){return x.id===rid;});if(r.crId){if(open)editCR(cid,r.crId);return;}
 var prev=c.crs.slice().sort(function(a,b){return b.numero-a.numero;})[0],obs=[];
 if(prev)prev.observations.forEach(function(o){if(o.type!=='info'&&!o.solde)obs.push({id:uid(),lotId:o.lotId,texte:o.texte,type:o.type,resp:o.resp,ech:o.ech,report:true,solde:false});});
 c.taches.filter(function(x){return x.statut!=='done'&&!x.origine;}).forEach(function(x){obs.push({id:uid(),lotId:x.lotId,texte:x.titre,type:'action',resp:x.assigne,ech:x.echeance,report:true,solde:false,tacheId:x.id});});
 var cr={id:uid(),numero:(prev?prev.numero:0)+1,reunionId:rid,date:r.date,meteo:'',effectifs:'',
  presences:r.convoques.map(function(i){return{id:i,s:'P'};}),observations:obs,avancement:c.lots.map(function(l){return{lotId:l.id,pct:lotPct(l)};}),
  prochaine:addDays(r.date,7),prochaineH:r.heure,diffuse:false,auto:!!auto};
 c.crs.push(cr);r.crId=cr.id;journal(c,'CR','CR n°'+cr.numero+' créé'+(auto?' automatiquement':'')+' ('+obs.length+' point(s) reporté(s))',auto?'auto':'manuel');save();
 if(open){editCR(cid,cr.id);}return cr;}
function editCR(cid,crid){var c=C(cid),cr=c.crs.find(function(x){return x.id===crid;});
 var h='<div class="mdh"><div class="ct">Compte rendu n°'+cr.numero+' — '+esc(c.nom)+'</div><button class="x" onclick="closeOv()">×</button></div>'+
 (cr.auto&&!cr.diffuse?'<div class="alert i">Brouillon pré-rempli automatiquement : points non soldés du CR précédent et tâches ouvertes reportés.</div>':'')+
 '<div class="row"><div><label class="fl">Date</label><input type="date" id="cr_date" value="'+esc(cr.date)+'"></div><div><label class="fl">Météo</label><input id="cr_met" value="'+esc(cr.meteo)+'" placeholder="Beau, 12°C"></div><div><label class="fl">Effectifs sur site</label><input id="cr_eff" value="'+esc(cr.effectifs)+'"></div></div>'+
 '<label class="fl">Présences</label><div class="tw"><table>'+c.intervenants.map(function(i){var p=cr.presences.find(function(x){return x.id===i.id;}),s=p?p.s:'-';
  return'<tr><td>'+esc(i.nom)+' <span class="mono">'+esc(i.societe||i.role)+'</span></td><td style="width:220px"><select class="cr_pr" data-id="'+i.id+'">'+opts([['P','Présent'],['A','Absent'],['E','Excusé'],['-','Non convoqué']],s)+'</select></td></tr>';}).join('')+'</table></div>'+
 '<label class="fl">Observations</label><div id="cr_obs">'+cr.observations.map(function(o){return obsRow(c,o);}).join('')+'</div><button class="btn btg bts" onclick="addObs(\''+cid+'\')">+ Observation</button>'+
 '<label class="fl">Avancement par lot (depuis les étapes validées)</label><div class="mono">'+c.lots.map(function(l){return l.code+' '+esc(l.nom)+' : '+lotPct(l)+' %';}).join(' · ')+'</div>'+
 '<div class="row"><div><label class="fl">Prochaine réunion</label><input type="date" id="cr_nx" value="'+esc(cr.prochaine)+'"></div><div><label class="fl">Heure</label><input type="time" id="cr_nxh" value="'+esc(cr.prochaineH||'09:00')+'"></div></div>'+
 '<div class="mdf"><button class="btn btr" onclick="delCR(\''+cid+'\',\''+crid+'\')">Supprimer</button><button class="btn btg" onclick="saveCR(\''+cid+'\',\''+crid+'\');printCR(\''+cid+'\',\''+crid+'\')">🖨 PDF</button><button class="btn btg" onclick="saveCR(\''+cid+'\',\''+crid+'\');closeOv();toast(\'Brouillon enregistré\')">Enregistrer</button><button class="btn btv" onclick="validerCR(\''+cid+'\',\''+crid+'\')">'+(cr.diffuse?'Rediffuser':'Valider & diffuser')+'</button></div>';
 openOv(h,true);}

function saveCR(cid,crid){var c=C(cid),cr=c.crs.find(function(x){return x.id===crid;});
 cr.date=val('cr_date');cr.meteo=val('cr_met');cr.effectifs=val('cr_eff');cr.prochaine=val('cr_nx');cr.prochaineH=val('cr_nxh');
 cr.presences=[].slice.call(document.querySelectorAll('.cr_pr')).map(function(s){return{id:s.dataset.id,s:s.value};}).filter(function(p){return p.s!=='-';});
 var old={};cr.observations.forEach(function(o){old[o.id]=o;});
 cr.observations=[].slice.call(document.querySelectorAll('#cr_obs .obs')).map(function(e){var o=old[e.dataset.id]||{id:e.dataset.id};
  o.lotId=e.querySelector('.o_lot').value;o.type=e.querySelector('.o_type').value;o.resp=e.querySelector('.o_resp').value;o.ech=e.querySelector('.o_ech').value;o.texte=e.querySelector('.o_txt').value.trim();o.solde=e.querySelector('.o_sol').checked;return o;}).filter(function(o){return o.texte;});

function delCR(cid,crid){if(!confirm('Supprimer ce CR ?'))return;var c=C(cid);c.crs=c.crs.filter(function(x){return x.id!==crid;});c.reunions.forEach(function(r){if(r.crId===crid)r.crId=null;});save();closeOv();render();}
function validerCR(cid,crid){saveCR(cid,crid);var c=C(cid),cr=c.crs.find(function(x){return x.id===crid;}),R=DB.rules,n=0;
 // Synchroniser observations <-> tâches
 cr.observations.forEach(function(o){
  if(o.tacheId){var t=c.taches.find(function(x){return x.id===o.tacheId;});if(t&&o.solde&&t.statut!=='done'){t.statut='done';t.fait=today();t.dirty=true;}}
  else if(R.tachesCR.on&&o.type==='action'&&!o.solde){var nt={id:uid(),titre:o.texte,lotId:o.lotId,assigne:o.resp,echeance:o.ech||addDays(today(),7),prio:2,statut:'todo',origine:cr.id,cree:today(),dirty:true};c.taches.push(nt);o.tacheId=nt.id;n++;}
  if(o.type==='reserve'&&!o.reserveId&&!o.solde){var rv={id:uid(),lotId:o.lotId,localisation:'',description:o.texte,constat:cr.date,echeance:o.ech||addDays(today(),15),statut:'ouverte'};c.reserves.push(rv);o.reserveId=rv.id;}
 });
 if(n)logA('Tâches depuis CR',n+' tâche(s) créée(s) depuis le CR n°'+cr.numero+' — '+c.nom);
 // Prochaine réunion

function mailTpl(salut,corps){return'<div style="font-family:Arial,sans-serif;font-size:13px;color:#222"><p>'+salut+'</p>'+corps+'<p>Cordialement,</p>'+(DB.settings.signature?'<p>'+esc(DB.settings.signature).replace(/\n/g,'<br>')+'</p>':'<p>'+esc(DB.settings.nom)+'<br>'+esc(DB.settings.societe)+'</p>')+'</div>';}
function onceKey(k){if(DB.done[k])return false;DB.done[k]=today();return true;}
var running=false;
function runAutomations(manual){if(running)return Promise.resolve();running=true;
 var R=DB.rules,t=today(),n0=DB.log.length;
 DB.chantiers.forEach(function(c){if(c.statut==='termine')return;
  // R1 Rappel réunion J-n
  if(R.rappelReunion.on)c.reunions.forEach(function(r){var dd=diff(t,r.date);if(dd>=0&&dd<=R.rappelReunion.jours&&!r.rappel){var to=emailsOf(c,r.convoques);
   if(to.length){sendMail(c,to,'['+c.ref+'] Rappel : '+r.type+' le '+frl(r.date)+' à '+r.heure,mailTpl('Bonjour,','<p>Nous vous rappelons la <b>'+esc(r.type.toLowerCase())+'</b> du chantier <b>'+esc(c.nom)+'</b> :</p><p>📅 '+frl(r.date)+' à '+esc(r.heure)+'<br>📍 '+esc(r.lieu||c.adresse||'')+'</p>'+(r.notes?'<p><b>Ordre du jour :</b><br>'+esc(r.notes).replace(/\n/g,'<br>')+'</p>':'')+openPointsHTML(c)),'rappel');
    r.rappel=t;logA('Rappel réunion','Rappel envoyé à '+to.length+' convoqué(s) — '+c.nom+' '+fr(r.date));}}});
  // R2 CR auto
  if(R.crAuto.on)c.reunions.forEach(function(r){if(r.date<t&&!r.crId&&/Réunion|Visite|OPR/.test(r.type)){newCR(c.id,r.id,false,true);logA('CR automatique','Brouillon CR créé pour la réunion du '+fr(r.date)+' — '+c.nom);}});
  // R4 Relance tâches en retard
  if(R.relanceTaches.on)tachesRetard(c).forEach(function(x){var p=x.assigne&&intOf(c,x.assigne);if(!p||!p.email)return;if(x.relance&&diff(x.relance,t)<R.relanceTaches.freq)return;
   sendMail(c,[p.email],'['+c.ref+'] Relance : '+x.titre+' (échéance '+fr(x.echeance)+')',mailTpl('Bonjour '+esc(p.nom)+',','<p>L\'action suivante, attendue pour le <b>'+fr(x.echeance)+'</b>, n\'est pas encore soldée :</p><p><b>'+esc(x.titre)+'</b><br>Lot : '+esc(lotName(c,x.lotId))+'</p><p>Merci de nous indiquer une date de réalisation.</p>'),'relance');

function icsDT(d,h,add){var x=new Date(d+'T'+(h||'09:00')+':00');x.setMinutes(x.getMinutes()+(add||0));return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';}

 (cid?[C(cid)]:DB.chantiers).forEach(function(c){c.reunions.forEach(function(r){L.push('BEGIN:VEVENT','UID:'+r.id+'@equilibre-chantier','DTSTAMP:'+icsDT(today(),'00:00'),'DTSTART:'+icsDT(r.date,r.heure),'DTEND:'+icsDT(r.date,r.heure,r.duree||60),'SUMMARY:'+icsEsc('['+c.ref+'] '+r.type+' — '+c.nom),'LOCATION:'+icsEsc(r.lieu||c.adresse),'DESCRIPTION:'+icsEsc(r.notes),'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Rappel','END:VALARM','END:VEVENT');});});

function graph(method,path,body,extraH){return token().then(function(tk){var h={Authorization:'Bearer '+tk};if(body)h['Content-Type']='application/json';for(var k in extraH||{})h[k]=extraH[k];

 .then(function(r){if(r.status===204||r.status===202)return null;return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j;});});}

 var st=r.date+'T'+(r.heure||'09:00')+':00',en=new Date(st);en.setMinutes(en.getMinutes()+(r.duree||60));
 return{subject:'['+c.ref+'] '+r.type+' — '+c.nom,body:{contentType:'HTML',content:'<p>'+esc(r.type)+' — chantier '+esc(c.nom)+'</p>'+(r.notes?'<p>'+esc(r.notes).replace(/\n/g,'<br>')+'</p>':'')+openPointsHTML(c)},
  start:{dateTime:st,timeZone:'Europe/Paris'},end:{dateTime:iso(en)+'T'+pad(en.getHours())+':'+pad(en.getMinutes())+':00',timeZone:'Europe/Paris'},
  location:{displayName:r.lieu||c.adresse||''},attendees:at,isReminderOn:true,reminderMinutesBeforeStart:60,categories:['Chantier']};}

 var b={title:'['+c.ref+'] '+x.titre,status:x.statut==='done'?'completed':'notStarted',importance:x.prio==1?'high':x.prio==3?'low':'normal',body:{contentType:'text',content:'Chantier : '+c.nom+'\nLot : '+lotName(c,x.lotId)+(p?'\nResponsable : '+p.nom:'')+(x.notes?'\n'+x.notes:'')}};
 if(x.echeance)b.dueDateTime={dateTime:x.echeance+'T12:00:00',timeZone:'Europe/Paris'};

 return q.then(function(j){if(j&&j.id)x.todoId=j.id;x.dirty=false;});}).catch(function(e){if(/not found|404/i.test(e.message)){DB.settings.todoList='';x.todoId=null;}logA('Outlook','Erreur To Do : '+e.message);});}
function syncTodo(){var jobs=[];DB.chantiers.forEach(function(c){c.taches.forEach(function(x){if(!x.todoId||x.dirty)jobs.push(function(){return pushTask(c,x);});});});
 // Pull : tâches cochées dans Outlook / To Do
 return jobs.reduce(function(p,f){return p.then(f);},Promise.resolve()).then(function(){if(!DB.settings.todoList)return;
  return graph('GET','/me/todo/lists/'+DB.settings.todoList+'/tasks?$top=200&$select=id,status').then(function(j){var st={};(j.value||[]).forEach(function(t){st[t.id]=t.status;});
   DB.chantiers.forEach(function(c){c.taches.forEach(function(x){if(x.todoId&&st[x.todoId]==='completed'&&x.statut!=='done'){x.statut='done';x.fait=today();journal(c,'Tâche','Soldée depuis Outlook / To Do : '+x.titre,'outlook');logA('Sync To Do','Tâche soldée depuis To Do : '+x.titre);}});});});});}

 return jobs.reduce(function(p,f){return p.then(f);},Promise.resolve()).then(function(){
  // Pull : RDV créés dans Outlook dont le sujet contient [REF]
  var a=today()+'T00:00:00',b=addDays(today(),60)+'T23:59:59';
  return graph('GET','/me/calendarView?startDateTime='+a+'&endDateTime='+b+'&$top=200&$select=id,subject,start,end,location,attendees',null,{Prefer:'outlook.timezone="Europe/Paris"'}).then(function(j){
   (j.value||[]).forEach(function(ev){DB.chantiers.forEach(function(c){if((ev.subject||'').indexOf(c.ref)<0)return;var ex=c.reunions.find(function(r){return r.outlookId===ev.id;});
    var d=ev.start.dateTime.slice(0,10),h=ev.start.dateTime.slice(11,16),dur=Math.round((new Date(ev.end.dateTime)-new Date(ev.start.dateTime))/6e4);

    var typ=TYPES_RDV.find(function(t){return ev.subject.toLowerCase().indexOf(t.toLowerCase())>=0;})||'RDV entreprise';
    var mails=(ev.attendees||[]).map(function(x){return(x.emailAddress.address||'').toLowerCase();});
    c.reunions.push({id:uid(),type:typ,date:d,heure:h,duree:dur,lieu:(ev.location&&ev.location.displayName)||'',convoques:c.intervenants.filter(function(i){return i.email&&mails.indexOf(i.email.toLowerCase())>=0;}).map(function(i){return i.id;}),notes:'',outlookId:ev.id,dirty:false});
    journal(c,'RDV','Importé depuis Outlook : '+ev.subject+' ('+fr(d)+')','outlook');logA('Sync agenda','RDV importé : '+ev.subject);});});});});}
function syncMails(){var jobs=DB.chantiers.filter(function(c){return c.statut!=='termine';}).map(function(c){return function(){

  c.journal.sort(function(a,b){return b.date.localeCompare(a.date);});}).catch(function(e){logA('Outlook','Erreur e-mails : '+e.message);});};});

function importDB(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var d;try{d=JSON.parse(r.result);if(!d.chantiers)throw 0;}catch(e){toast('Fichier invalide');return;}
 var ph=d._photos||{};delete d._photos;Promise.all(Object.keys(ph).map(function(k){return phPut(k,ph[k]);})).then(function(){DB=d;save();location.reload();}).catch(function(e){toast('Import des photos impossible : '+e.message);});};r.readAsText(f);}

/* =========================================================
   PHOTOS (IndexedDB, compressées)
   ========================================================= */
var PHT=[];var _pdb=null;
function phDB(){if(_pdb)return _pdb;_pdb=new Promise(function(res,rej){if(!window.indexedDB){rej(new Error('IndexedDB indisponible'));return;}var q=indexedDB.open('eqbtp_photos',1);q.onupgradeneeded=function(){q.result.createObjectStore('p');};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});return _pdb;}
function phTx(mode,fn){return phDB().then(function(db){return new Promise(function(res,rej){var t=db.transaction('p',mode),out=fn(t.objectStore('p'));t.oncomplete=function(){res(out?out.result:undefined);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('Stockage plein'));};});});}
function phPut(id,data){return phTx('readwrite',function(st){st.put(data,id);});}
function phDel(id){delete _phc[id];return phTx('readwrite',function(st){st.delete(id);}).catch(function(){});}
var _phc={};
function phGet(id){if(_phc[id])return Promise.resolve(_phc[id]);return phTx('readonly',function(st){return st.get(id);}).then(function(v){if(v)_phc[id]=v;return v;});}
function phAll(){return phDB().then(function(db){return new Promise(function(res,rej){var o={},t=db.transaction('p','readonly'),q=t.objectStore('p').openCursor();q.onsuccess=function(){var cu=q.result;if(cu){o[cu.key]=cu.value;cu.continue();}};t.oncomplete=function(){res(o);};t.onerror=function(){rej(t.error);};});}).catch(function(){return{};});}
function fillPh(root){var L=[].slice.call((root||document).querySelectorAll('img[data-ph]:not([src])'));
 return Promise.all(L.map(function(im){return phGet(im.dataset.ph).then(function(v){if(v){im.src=v;im.onclick=function(e){e.stopPropagation();$('lbImg').src=v;$('lb').classList.add('on');};}else{var t=im.closest('.ph-t');if(t)t.remove();}}).catch(function(){});}));}
function compressImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();
 im.onload=function(){var M=1600,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h));var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.72));};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Image illisible'));};im.src=u;});}
function phEditor(){return'<div class="phs-w" id="phEd">'+PHT.map(phThumbEd).join('')+'<label class="ph-add" onclick="$(\'phInput\').click()"><b>📷</b>Ajouter</label></div><div class="mono" style="margin-top:4px">Sur téléphone : appareil photo ou galerie. Photos compressées et stockées sur l\'appareil.</div>';}
function phThumbEd(id){return'<div class="ph-t" data-id="'+id+'"><img data-ph="'+id+'" alt=""><button type="button" title="Retirer" onclick="phRemove(\''+id+'\')">×</button></div>';}
function phRemove(id){PHT=PHT.filter(function(x){return x!==id;});var e=document.querySelector('#phEd .ph-t[data-id="'+id+'"]');if(e)e.remove();}
$('phInput').addEventListener('change',function(){var fs=[].slice.call(this.files||[]);this.value='';if(!fs.length)return;toast('Traitement de '+fs.length+' photo(s)…');
 fs.reduce(function(p,f){return p.then(function(){return compressImg(f).then(function(data){var id='ph_'+uid();return phPut(id,data).then(function(){_phc[id]=data;PHT.push(id);var ed=$('phEd');if(ed){var d=document.createElement('div');d.innerHTML=phThumbEd(id);ed.insertBefore(d.firstChild,ed.lastElementChild);fillPh(ed);}});});});},Promise.resolve())
 .then(function(){toast(fs.length+' photo(s) ajoutée(s)');}).catch(function(e){toast('Photo non enregistrée : '+e.message);});});
function phUsed(){var u={};DB.chantiers.forEach(function(c){c.reserves.forEach(function(r){(r.photos||[]).forEach(function(i){u[i]=1;});});c.journal.forEach(function(j){(j.photos||[]).forEach(function(i){u[i]=1;});});});return u;}
function phGC(){if($('ov').classList.contains('on'))return;phAll().then(function(all){var u=phUsed();Object.keys(all).filter(function(k){return!u[k];}).forEach(phDel);});}
function stoInfo(){var e=$('stoInfo');if(!e)return;phAll().then(function(all){var n=Object.keys(all).length;
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(function(x){e.textContent=n+' photo(s) · espace utilisé : '+(x.usage/1048576).toFixed(1)+' Mo sur '+(x.quota/1048576).toFixed(0)+' Mo disponibles'+(_persist?' · stockage persistant ✓':'');});else e.textContent=n+' photo(s)';});}
