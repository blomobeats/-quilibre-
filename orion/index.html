<style>
:root{
  --bg:#02030a; --glass2:rgba(18,26,52,.72); --edge:rgba(130,170,255,.14); --edge2:rgba(140,195,255,.38);
  --txt:#eaf0ff; --mut:#8f9cc2; --dim:#58627f; --cyan:#5ee7ff; --gold:#ffcf5c; --ok:#6ff0b0;
  --sans:"Space Grotesk","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
canvas{display:block;position:fixed;inset:0;cursor:grab}
canvas.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#scan{display:none!important;position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);opacity:.6}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11.5px;letter-spacing:.02em;color:#c3cdee;text-shadow:0 0 6px #000,0 0 14px #000,0 0 2px #000;transition:opacity .3s}
.lab.dom{font:600 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;text-align:center}
.lab.dom small{display:block;font:400 9.5px var(--mono);letter-spacing:.18em;color:var(--mut);margin-top:4px;opacity:.85}
.lab.cours{font:600 12.5px var(--sans);color:#1a1200;background:linear-gradient(90deg,#ffe08a,#ffb347);padding:3px 11px 3px 9px;border-radius:999px;text-shadow:none;box-shadow:0 0 0 1px rgba(255,230,160,.6),0 0 22px rgba(255,190,80,.75)}
.lab.cours::before{content:"◎ "}
.lab.sub{font:500 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase}
.lab.sub::before{content:"✧ "}
.hud{position:fixed;z-index:5;transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
body.pre .hud{opacity:0}
body.pre #left{transform:translateX(-40px)}
body.pre #right{transform:translateX(40px)}
body.pre #bottom{transform:translate(-50%,40px)}
body.pre #stats{transform:translateY(-20px)}
.panel{position:relative;background:linear-gradient(165deg,rgba(18,28,58,.6),rgba(5,8,20,.52));border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);padding:15px 16px;box-shadow:0 14px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--edge2);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.panel h3{display:flex;align-items:center;gap:10px;margin:0 0 11px;font:500 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.panel h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
#brand{top:22px;left:26px}
#brand .w{font:500 26px var(--sans);letter-spacing:.55em;color:var(--txt);text-shadow:0 0 18px rgba(94,231,255,.35)}
#brand .w span{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
#brand .s{font:400 10.5px var(--mono);color:var(--mut);letter-spacing:.12em;margin-top:6px}
#now{left:50%;top:26px;transform:translateX(-50%);font:500 11px var(--mono);letter-spacing:.24em;color:var(--gold);text-transform:uppercase;text-shadow:0 0 14px rgba(255,207,92,.8);white-space:nowrap;display:flex;align-items:center;gap:10px}
#now::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#stats{top:22px;right:26px;display:flex;gap:26px}
.st{font:400 10px var(--mono);letter-spacing:.16em;color:var(--mut);text-transform:uppercase;text-align:right}
.st b{display:block;font:500 26px var(--sans);color:var(--txt);letter-spacing:0;text-shadow:0 0 16px rgba(140,190,255,.35)}
.st.g b{color:var(--gold);text-shadow:0 0 16px rgba(255,207,92,.55)}
#left{top:112px;left:26px;width:300px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 200px);overflow:auto}
#right{top:112px;right:26px;width:300px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 200px);overflow:auto}
#left::-webkit-scrollbar,#right::-webkit-scrollbar{width:0}
.panel.now{border-color:rgba(255,207,92,.5);background:linear-gradient(165deg,rgba(60,44,10,.42),rgba(8,8,18,.55));box-shadow:0 0 34px rgba(255,190,80,.18),inset 0 0 26px rgba(255,207,92,.06),0 14px 44px rgba(0,0,0,.4)}
.panel.now::before,.panel.now::after{border-color:rgba(255,215,120,.85)}
.panel.now h3{color:var(--gold)}
.panel.now h3::after{background:linear-gradient(90deg,rgba(255,207,92,.6),transparent)}
.wk{display:flex;align-items:center;gap:11px;padding:8px 7px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:background .2s,transform .2s}
.wk:hover{background:rgba(255,207,92,.09);transform:translateX(3px)}
.wk i{width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 10px var(--gold);flex:none;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 18px var(--gold),0 0 4px var(--gold) inset}}
.wk small{display:block;color:var(--dim);font:400 10.5px var(--mono);margin-top:2px}
.wk small b{color:var(--gold);font-weight:500}
.big{font:600 30px var(--sans)}.big small{font:400 12px var(--mono);color:var(--mut);margin-left:6px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin:10px 0 6px;overflow:hidden}
.bar div{height:100%;border-radius:3px;background:linear-gradient(90deg,#3a7bff,var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bar.g div{background:linear-gradient(90deg,#ff9f43,var(--gold));box-shadow:0 0 12px var(--gold)}
.row{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--mut)}
.it{font-size:13px;padding:6px 0;display:flex;gap:10px;align-items:baseline;border-top:1px solid rgba(255,255,255,.05)}
.it:first-of-type{border-top:0}
.tg{font:400 10px var(--mono);color:var(--dim);white-space:nowrap;margin-left:auto}
.d{font:400 10.5px var(--mono);color:var(--dim);white-space:nowrap}
.mood{font-size:13px;line-height:1.5}
.env{font-size:13px;color:var(--ok);padding:3px 0}
.env::before{content:"✦ ";opacity:.7}
#bottom{left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 52px)}
.chip{background:rgba(8,12,28,.6);border:1px solid var(--edge);color:var(--mut);border-radius:999px;padding:6px 12px;font:500 11.5px var(--sans);cursor:pointer;display:flex;gap:7px;align-items:center;backdrop-filter:blur(10px);transition:all .2s}
.chip:hover{color:var(--txt);border-color:var(--edge2)}
.chip i{width:7px;height:7px;border-radius:50%}
.chip.on{color:var(--txt);border-color:rgba(160,190,255,.5);background:var(--glass2)}
.chip.act{color:var(--cyan);border-color:rgba(94,231,255,.4)}
.chip.cf{color:var(--gold);border-color:rgba(255,207,92,.55)}
.chip.cf.on{background:rgba(255,207,92,.15);box-shadow:0 0 16px rgba(255,207,92,.35)}
#legend{left:26px;bottom:24px;display:flex;gap:16px;font:400 11px var(--mono);color:var(--mut)}
#legend span{display:flex;align-items:center;gap:7px}
.lg1{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px #9cf}
.lg2{width:7px;height:7px;border-radius:50%;background:#9ab}
.lg3{width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 8px var(--gold)}
.lg4{width:4px;height:4px;border-radius:50%;background:#789}
#card{left:50%;top:70px;transform:translateX(-50%) translateY(-10px);opacity:0;transition:.3s;pointer-events:none;min-width:330px;max-width:540px}
#card.on{opacity:1;transform:translateX(-50%)}
#card .t{font:600 17px var(--sans)}
#card .m{font:400 11px var(--mono);color:var(--mut);margin-top:6px;letter-spacing:.04em}
.badge{display:inline-block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;margin-left:8px;vertical-align:3px}
.b-maitrise{color:#bfe9ff;border-color:rgba(191,233,255,.4)}
.b-acquis{color:#9fb3d9;border-color:rgba(159,179,217,.35)}
.b-en_cours{color:var(--gold);border-color:rgba(255,207,92,.5);box-shadow:0 0 10px rgba(255,207,92,.25)}
.b-interet{color:#8a96b5;border-color:rgba(138,150,181,.3)}
#card ul{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--mut)}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;transition:opacity 1.6s ease}
#intro .w{font:300 68px var(--sans);letter-spacing:1.1em;padding-left:1.1em;color:#fff;text-shadow:0 0 30px rgba(94,231,255,.9),0 0 90px rgba(94,231,255,.45);animation:iw 2.8s cubic-bezier(.2,.8,.2,1) both}
#intro .w span{color:var(--cyan)}
#intro .s{font:400 11px var(--mono);letter-spacing:.55em;padding-left:.55em;color:var(--mut);margin-top:22px;text-transform:uppercase;animation:is 2s .6s both}
@keyframes iw{from{letter-spacing:2.4em;opacity:0;filter:blur(14px)}to{letter-spacing:1.1em;opacity:1;filter:blur(0)}}
@keyframes is{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#intro.out{opacity:0}
body.lite .panel,body.lite .chip{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,12,26,.9)}
body.lite .panel.now{background:rgba(30,24,8,.92)}
body.lite .wk i,body.lite #now::before{animation:none}
body.lite .lab{text-shadow:0 0 4px #000,0 0 2px #000}
@media (max-width:1100px){#right{display:none}}
body.mob #stats,body.mob #legend,body.mob #right{display:none}
body.mob #brand{top:14px;left:max(16px,env(safe-area-inset-left,0px))}
body.mob #brand .w{font-size:20px;letter-spacing:.45em}
body.mob #brand .s{font-size:9px}
body.mob #now{display:none}
body.mob #bottom{top:62px;bottom:auto;left:0;right:0;transform:none;max-width:none;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
body.mob #bottom::-webkit-scrollbar{display:none}
body.mob .chip{flex:none;padding:7px 12px;font-size:12px}
body.mob #card{top:108px;left:12px;right:12px;min-width:0;max-width:none;transform:translateY(-10px)}
body.mob #card.on{transform:none}
body.mob #left{top:auto;left:0;right:0;bottom:0;width:auto;max-height:38vh;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(2,3,10,0),rgba(2,3,10,.85) 26px);transition:max-height .35s ease,transform 1.3s cubic-bezier(.2,.8,.2,1),opacity 1.3s}
body.mob #left.min{max-height:calc(150px + env(safe-area-inset-bottom,0px));overflow:hidden}
body.mob.pre #left{transform:translateY(60px)}
body.mob #grip{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;height:30px;flex:none;border:0;background:transparent;cursor:pointer;padding:0}
body.mob #grip span{width:44px;height:5px;border-radius:3px;background:rgba(200,215,255,.45)}
body.mob .panel{padding:12px 14px}
body.mob .mstats{display:flex;justify-content:space-between;padding:10px 14px}
body.mob .mstats .st{text-align:center;font-size:8.5px;letter-spacing:.1em}
body.mob .mstats .st b{font-size:19px}
body.mob .wk{font-size:13px;padding:7px 4px}
body.mob .lab{font-size:10px}
body.mob .lab.dom{font-size:11.5px;letter-spacing:.2em;font-weight:700}
body.mob .lab.dom small{font-size:8.5px;color:#aab6d8}
body.mob .lab.cours{font-size:10.5px;padding:2px 8px 2px 7px}
.mstats{display:none}
#grip{display:none}
.panel.fold h3{cursor:pointer;margin:0;user-select:none;-webkit-user-select:none;padding:2px 0}
.panel.fold.open h3{margin-bottom:11px}
.panel.fold:not(.open)>:not(h3){display:none}
.panel.fold{padding-top:12px;padding-bottom:12px;transition:border-color .2s}
.panel.fold:not(.open):hover{border-color:var(--edge2)}
.panel h3 .chev{display:inline-block;transition:transform .2s;font-size:11px;color:var(--mut)}
.panel.now h3 .chev{color:var(--gold)}
.panel.fold.open h3 .chev{transform:rotate(90deg)}
.panel h3::after{order:1}
.fsum{order:2;font:500 11.5px var(--mono);letter-spacing:.02em;color:var(--txt);text-transform:none;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.panel.now .fsum{color:var(--gold)}
.panel h3:focus-visible{outline:1px solid var(--edge2);outline-offset:4px;border-radius:4px}
@media (max-width:760px){#intro .w{font-size:40px}}
</style>
<style>
/* ================= Application : navigation, vues, formulaires ================= */
:root{--s-maitrise:#bfe9ff;--s-acquis:#7f9be0;--s-en_cours:#ffcf5c;--s-interet:#6b7899;--danger:#ff7a8a}
#nav{position:fixed;z-index:16;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(8,12,28,.62);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity 1.3s}
body.pre #nav{opacity:0;pointer-events:none}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font:500 12.5px var(--sans);color:var(--mut);letter-spacing:.02em;transition:color .2s,background .2s}
#nav button svg{width:15px;height:15px;flex:none}
#nav button:hover{color:var(--txt)}
#nav button.on{color:#06101e;background:linear-gradient(90deg,#9fefff,var(--cyan));box-shadow:0 0 18px rgba(94,231,255,.45)}
#nav button:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
#now{top:74px}
#card{top:108px}
@media (max-width:1320px){body:not(.mob) #stats{display:none}}
body.inview .hud,body.inview #labels{opacity:0!important;pointer-events:none!important}
body.inview canvas{filter:blur(3px) brightness(.55)}

#view{position:fixed;inset:0;z-index:12;overflow-y:auto;overscroll-behavior:contain;background:radial-gradient(1200px 700px at 50% -10%,rgba(40,70,140,.22),transparent 60%),rgba(2,3,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:84px 26px 60px;opacity:0;pointer-events:none;transition:opacity .35s}
#view.on{opacity:1;pointer-events:auto}
.vw{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 2px}
.vh h1{margin:0;font:500 26px var(--sans);letter-spacing:.02em}
.vh p{margin:6px 0 0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{padding:14px 16px}
.tile .k{font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.tile .v{font:500 28px var(--sans);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 12px var(--mono);color:var(--mut);margin-left:4px}
.tile .x{font:400 11px var(--mono);color:var(--dim);margin-top:4px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;font:500 12.5px var(--sans);color:var(--txt);border:1px solid var(--edge2);background:rgba(20,32,66,.6);transition:background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:rgba(40,60,110,.7)}
.btn.pri{color:#06101e;background:linear-gradient(90deg,#9fefff,var(--cyan));border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{border-color:var(--edge);background:transparent;color:var(--mut)}
.btn.gh:hover{color:var(--txt)}
.btn.dg{color:var(--danger);border-color:rgba(255,122,138,.4);background:transparent}
.btn:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .chip.on{color:var(--cyan);border-color:rgba(94,231,255,.5)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,.sel,textarea.inp{box-sizing:border-box;background:rgba(6,10,24,.7);border:1px solid var(--edge);color:var(--txt);border-radius:10px;padding:9px 12px;font:400 13.5px var(--sans);outline:none;min-width:0}
.inp:focus,.sel:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(94,231,255,.12)}
.sel option{background:#0b1226}
.search{flex:1;min-width:200px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:8px;transition:background .15s}
.li:first-child{border-top:0}
.li:hover{background:rgba(120,160,255,.06)}
.li .dot{width:9px;height:9px;border-radius:50%;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx span{display:block;font:400 10.5px var(--mono);color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;flex:none}
.grp{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.grp:first-child{margin-top:0}
.grp i{width:8px;height:8px;border-radius:50%}
.empty{color:var(--dim);font-size:13px;padding:18px 4px;text-align:center}
.dist .r{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;padding:4px 0;font-size:12.5px;cursor:pointer}
.dist .r:hover .nm{color:var(--txt)}
.dist .nm{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist .bars{display:flex;height:9px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.04)}
.dist .bars i{display:block;height:100%}
.dist .bars i+i{margin-left:2px}
.dist .n{font:400 11px var(--mono);color:var(--mut);text-align:right}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font:400 11px var(--mono);color:var(--mut)}

<script>
/* ================= Saisies : modifications faites dans l'appli =================
   Rangées dans la base sous orion/saisies (et en local en secours). Chaque saisie
   est idempotente : rejouée sur une base qui l'a déjà intégrée, elle ne double rien.
   Le bilan du soir peut les intégrer puis écrire {json:"[]", vide_avant:<date ISO>}. */
window.OrionStore = {
  ops: [], db: null, q: Promise.resolve(), state: 'local',
  merge(list) {
    const seen = new Set(this.ops.map(o => o.id));
    (Array.isArray(list) ? list : []).forEach(o => { if (o && o.id && o.op && !seen.has(o.id)) { seen.add(o.id); this.ops.push(o); } });
    this.ops.sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
  },
  readLocal() { try { return JSON.parse(localStorage.getItem('orion-saisies') || '[]'); } catch (e) { return []; } },
  saveLocal() { try { localStorage.setItem('orion-saisies', JSON.stringify(this.ops)); } catch (e) {} },
  async load(db, tick) {
    this.db = db; this.merge(this.readLocal());
    if (!db) return;
    try {
      const s = await Promise.race([db.doc('orion/saisies').get(), tick(2500)]);
      const d = s && s.exists ? s.data() : null;
      let remote = [];
      if (d && typeof d.json === 'string') remote = JSON.parse(d.json);
      if (d && d.vide_avant) this.ops = this.ops.filter(o => String(o.ts) >= String(d.vide_avant));
      const before = remote.length; this.merge(remote); this.saveLocal(); this.state = 'ok';
      if (this.ops.length > before) this.sync();
    } catch (e) { this.state = 'local'; }
  },
  push(op) {
    op.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    op.ts = new Date().toISOString();
    this.ops.push(op); this.saveLocal(); return this.sync();
  },
  sync() {
    if (!this.db) return Promise.resolve(false);
    this.q = this.q.then(() => this.db.doc('orion/saisies').set({json: JSON.stringify(this.ops), maj: new Date().toISOString(), n: this.ops.length})
      .then(() => { this.state = 'ok'; return true; }, () => { this.state = 'local'; return false; }));
    return this.q;
  }
};
window.orionApply = function (O, op) {
  const C = O.connaissances = O.connaissances || [], J = O.journal = O.journal || [];
  const day = (op.ts || new Date().toISOString()).slice(0, 10);
  const jn = (type, texte, date) => { date = date || day; if (!J.some(j => j.date === date && j.texte === texte)) J.push({date, type, texte, saisie: true}); };
  const lien = (a, b, r) => { const L = O.liens = O.liens || []; if (a && b && a !== b && !L.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a))) L.push({a, b, r: r || 'lié'}); };
  switch (op.op) {
    case 'k_add': if (op.k && op.k.t && !C.some(k => k.t === op.k.t)) { C.push({...op.k}); jn('saisie', 'Ajout : ' + op.k.t, op.k.date); } if (op.lien) lien(op.k.t, op.lien.b, op.lien.r); break;
    case 'k_edit': { const k = C.find(k => k.t === op.t); if (k) { const old = k.t; Object.assign(k, op.patch); if (op.patch.t && op.patch.t !== old) (O.liens || []).forEach(l => { if (l.a === old) l.a = op.patch.t; if (l.b === old) l.b = op.patch.t; }); } if (op.lien) lien((op.patch && op.patch.t) || op.t, op.lien.b, op.lien.r); break; }
    case 'k_del': O.connaissances = C.filter(k => k.t !== op.t); O.liens = (O.liens || []).filter(l => l.a !== op.t && l.b !== op.t); break;
    case 'etape': { const o = (O.objectifs || []).find(o => o.t === op.obj), e = o && (o.etapes || []).find(e => e.n === op.n); if (e) { e.fait = !!op.fait; if (op.fait) jn('objectif', 'Étape faite : ' + e.t); } break; }
    case 'obj_add': { const L = O.objectifs = O.objectifs || []; if (op.o && op.o.t && !L.some(o => o.t === op.o.t)) { L.push({...op.o}); jn('objectif', 'Nouvel objectif : ' + op.o.t); } break; }
    case 'projet': { const P = O.projets = O.projets || [], p = P.find(p => p.t === op.t); if (p) p.statut = op.statut; else { P.push({t: op.t, statut: op.statut}); jn('saisie', 'Nouveau projet : ' + op.t); } break; }
    case 'humeur': { const H = O.humeurs = O.humeurs || []; if (!H.some(h => h.date === op.date && h.t === op.t)) H.push({date: op.date, t: op.t}); break; }
    case 'envie': { const H = O.envies = O.envies || []; if (!H.some(h => h.t === op.t)) H.push({date: op.date, t: op.t}); break; }
    case 'note': jn(op.type || 'perso', op.texte, op.date); break;
    case 'course': { const CO = O.course = O.course || {}; const S = CO.sorties = CO.sorties || []; if (op.s && !S.some(s => s.date === op.s.date && +s.km === +op.s.km)) { S.push({...op.s}); S.sort((a, b) => String(a.date).localeCompare(String(b.date))); jn('course', `Sortie : ${String(op.s.km).replace('.', ',')} km en ${op.s.duree}${op.s.allure ? ' (' + op.s.allure + '/km)' : ''}`, op.s.date); } break; }
    case 'piano': { const P = O.piano = O.piano || {}; const S = P.seances = P.seances || []; if (op.s && !S.some(s => s.date === op.s.date && s.contenu === op.s.contenu)) { S.push({...op.s}); S.sort((a, b) => String(a.date).localeCompare(String(b.date))); jn('piano', `Séance ${op.s.duree_min} min : ${op.s.contenu}`, op.s.date); }
      if (op.progression != null && P.morceau_en_cours) { P.morceau_en_cours.progression = op.progression; if (op.repere) P.morceau_en_cours.repere = op.repere; } break; }
    case 'echecs': { const E = O.echecs = O.echecs || {}; const H = E.historique = E.historique || []; let h = H.find(h => h.date === op.date);
      if (!h) { h = {date: op.date}; H.push(h); H.sort((a, b) => String(a.date).localeCompare(String(b.date))); }
      if (op.rapide) h.rapide = op.rapide; if (op.blitz) h.blitz = op.blitz;
      if (!E.releve || op.date >= E.releve) { E.releve = op.date; E.elo = E.elo || {}; if (op.rapide) E.elo.rapide = op.rapide; if (op.blitz) E.elo.blitz = op.blitz; }
      jn('echecs', `Relevé manuel : ${op.rapide || '—'} en rapide`, op.date); break; }
  }
};

/* ================= Application ================= */

const DOMS = () => [...(O.domaines || []).map((d, i) => ({...d, col: PAL[i % PAL.length]})), {id: 'toile', nom: 'Toile extérieure', col: '#9aa6c8'}];
const dom = id => DOMS().find(d => d.id === id) || {id, nom: id || '—', col: '#9aa6c8'};
const sub = id => (O.sous_domaines || []).find(s => s.id === id);
const ICON = {
  carte: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.6"/><circle cx="19" cy="7" r="1.6"/><circle cx="17" cy="18" r="1.6"/><circle cx="6" cy="17" r="1.6"/><path d="M6.3 7l4 3.5M17.6 8l-3.8 2.8M15.8 16.8l-2.4-3M7.4 16l2.9-2.4"/></svg>',
  explorer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>',
  objectifs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg>',
  suivi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  donnees: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/></svg>'
};
const MODE = window.ORION_MODE || 'artifact';

/* ---------- squelette ---------- */
const nav = document.createElement('nav'); nav.id = 'nav'; nav.setAttribute('aria-label', 'Navigation');

function toast(msg, btn, fn) {

const syncTag = () => `<span id="sync" class="${S.state === 'ok' ? 'ok' : ''}">${S.state === 'ok' ? '● synchronisé' : S.db ? '○ en attente de synchro' : '○ enregistré sur cet appareil'}</span>`;

/* ---------- graphiques SVG ---------- */

  const step = Math.max(1, Math.ceil((y2 - y1) / 4 / 10) * 10);
  let g = '';
  for (let v = Math.ceil(y1 / step) * step; v <= y2; v += step) g += `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const xt = [x1, (x1 + x2) / 2, x2].map((v, i) => `<text x="${X(v)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${fmt(new Date(v).toISOString().slice(0, 10))}</text>`).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(+new Date(p.x)).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(+new Date(pts[pts.length - 1].x)).toFixed(1)} ${H - B} L${X(+new Date(pts[0].x)).toFixed(1)} ${H - B} Z`;
  const tgt = o.target != null ? `<line x1="${L}" x2="${W - Rr}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--gold)" stroke-dasharray="4 5" opacity=".8"/><text x="${W - Rr}" y="${Y(o.target) - 6}" text-anchor="end" style="fill:var(--gold)">objectif ${o.target}</text>` : '';
  const proj = o.proj ? `<line x1="${X(+new Date(o.proj[0].x))}" y1="${Y(o.proj[0].y)}" x2="${X(+new Date(o.proj[1].x))}" y2="${Y(o.proj[1].y)}" stroke="var(--mut)" stroke-dasharray="2 5" opacity=".7"/>` : '';
  const last = pts[pts.length - 1];
  const dots = pts.map(p => `<circle cx="${X(+new Date(p.x))}" cy="${Y(p.y)}" r="${p === last ? 4.5 : 3}" fill="${p === last ? 'var(--cyan)' : '#0a1430'}" stroke="var(--cyan)" stroke-width="1.6"><title>${fmt(p.x)} : ${p.y}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'courbe')}"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5ee7ff" stop-opacity=".28"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/></linearGradient></defs>${g}${tgt}${proj}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--cyan)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${X(+new Date(last.x))}" y="${Y(last.y) - 10}" text-anchor="middle" style="fill:var(--txt);font-weight:500">${last.y}</text>${xt}</svg>`;
}
function barChart(rows, o = {}) {
  if (!rows.length) return '<div class="empty">Aucune donnée.</div>';
  const W = CW(), H = o.h || 220, L = 30, T = 18, B = 26, n = rows.length, bw = Math.min(46, (W - L - 10) / n * .62), gap = (W - L - 10) / n;
  const ymax = Math.max(o.target || 0, ...rows.map(r => r.y)) * 1.12, Y = v => T + (1 - v / ymax) * (H - T - B);
  let g = ''; for (let v = 0; v <= ymax; v += o.step || 2) g += `<line x1="${L}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const bars = rows.map((r, i) => { const x = L + i * gap + (gap - bw) / 2; return `<rect x="${x}" y="${Y(r.y)}" width="${bw}" height="${H - B - Y(r.y)}" rx="4" fill="${r.c || 'url(#gb)'}"><title>${esc(r.tip || r.y)}</title></rect><text x="${x + bw / 2}" y="${Y(r.y) - 5}" text-anchor="middle" style="fill:var(--txt)">${esc(r.lab ?? r.y)}</text>${(n <= 10 || i % Math.ceil(n / 8) === 0 || i === n - 1) ? `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${esc(r.x)}</text>` : ''}`; }).join('');
  const tgt = o.target ? `<line x1="${L}" x2="${W - 10}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--gold)" stroke-dasharray="4 5"/><text x="${W - 10}" y="${Y(o.target) - 6}" text-anchor="end" style="fill:var(--gold)">${esc(o.tlab || 'objectif')}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'histogramme')}"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6ff0b0"/><stop offset="1" stop-color="#1fbf7a" stop-opacity=".55"/></linearGradient></defs>${g}${tgt}${bars}</svg>`;
}
const bar = (pct, cls = '', style = '') => `<div class="bar ${cls}"><div style="width:${Math.max(2, Math.min(100, pct))}%;${style}"></div></div>`;

function activity(K) {
  const by = {}; K.forEach(k => { if (/\d{4}-\d{2}-\d{2}/.test(k.date || '')) by[k.date] = (by[k.date] || 0) + 1; });

  for (let i = 34; i >= 0; i--) { const d = new Date(end - i * 864e5).toISOString().slice(0, 10); days.push([d, by[d] || 0]); }

const toSec = s => { const p = String(s || '').split(':').map(Number); if (p.some(isNaN)) return 0; return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 60; };

const T0 = performance.now(), INTRO = 4600;

/* ================= boucle ================= */

  look.lerp(tLook, .06);

  const pulse = 1 + Math.sin(t * 1.6) * .05; coreMesh.scale.setScalar(pulse); corona.scale.set(290 * (1 + Math.sin(t * .9) * .06), 290 * (1 + Math.sin(t * .9) * .06), 1);

/* Données : la version la plus récente entre celle intégrée à la page et celle écrite par le bilan du soir dans la base */
